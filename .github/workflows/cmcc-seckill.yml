name: cmcc-seckill
on:
  schedule:
    - cron: "20 3 * * *"   # UTC 3:20 = 北京时间 11:20，脚本常驻等到 12:00 开抢
  workflow_dispatch:
jobs:
  seckill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: persist jwt cache
        uses: actions/cache@v4
        with:
          path: .cmcc_jwt_cache_*.json
          key: cmcc-jwt-${{ secrets.CMCC_PHONE }}-${{ github.run_id }}
          restore-keys: |
            cmcc-jwt-${{ secrets.CMCC_PHONE }}-
      - name: activity period guard
        id: guard
        run: |
          d=$(TZ=Asia/Shanghai date +%m%d)
          if [ "$d" -lt 1012 ] || [ "$d" -gt 1025 ]; then
            echo "当前不在秒杀活动期（10月12日-25日），跳过"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 1
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
        if: steps.guard.outputs.skip != 1
      - name: cmcc seckill
        if: steps.guard.outputs.skip != 1
        timeout-minutes: 75
        run: |
          set -o pipefail
          python cmcc_seckill.py 2>&1 | tee seckill.log
        env:
          CMCC_APP_TOKEN: ${{ secrets.CMCC_APP_TOKEN }}
          CMCC_PHONE: ${{ secrets.CMCC_PHONE }}
          CMCC_PROVINCE_CODE: ${{ secrets.CMCC_PROVINCE_CODE }}
          CMCC_CITY_CODE: ${{ secrets.CMCC_CITY_CODE }}
      - name: DingTalk notify
        if: always() && steps.guard.outputs.skip != 1
        shell: python
        run: |
          import base64, hashlib, hmac, os, time, urllib.parse
          import requests
          webhook = os.environ.get("DINGTALK_WEBHOOK", "")
          if not webhook:
              print("DINGTALK_WEBHOOK not set, skip")
              raise SystemExit(0)
          secret = os.environ.get("DINGTALK_SECRET", "")
          if secret:
              ts = str(round(time.time() * 1000))
              digest = hmac.new(secret.encode(), (ts + chr(10) + secret).encode(), hashlib.sha256).digest()
              webhook = webhook + "&timestamp=" + ts + "&sign=" + urllib.parse.quote_plus(base64.b64encode(digest))
          status = os.environ.get("JOB_STATUS", "unknown")
          try:
              log = open("seckill.log", encoding="utf-8", errors="replace").read()[-1200:]
          except OSError:
              log = "(no log)"
          NL = chr(10)
          text = "### 中国移动秒杀抢券 " + status + NL + "```" + NL + log + NL + "```" + NL + "[查看运行](" + os.environ.get("RUN_URL", "") + ")"
          r = requests.post(webhook, json={"msgtype": "markdown", "markdown": {"title": "中国移动签到", "text": text}}, timeout=15)
          print(r.text)
          r.raise_for_status()
        env:
          DINGTALK_WEBHOOK: ${{ secrets.CMCC_DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.CMCC_DINGTALK_SECRET }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
